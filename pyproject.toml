[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-service"
version = "0.1.0"
description = "Real-time sentiment analysis service for e-commerce reviews"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

# The console at /ui is an HTML file next to the module that serves it.
# setuptools ships only .py by default, so without this the page works from a
# source checkout and 404s inside the image — the worst kind of difference.
[tool.setuptools.package-data]
"sentiment.serving" = ["*.html"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
skip = [".venv", "__pycache__"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["venv", ".venv", "__pycache__", "tests"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: tests that load or train large models",
    "integration: tests requiring a running Docker Compose stack",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["src/sentiment"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/__init__.py",
    "src/sentiment/models/transformer.py",
    "src/sentiment/training/train.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
fail_under = 85

[tool.coverage.html]
directory = "htmlcov"
